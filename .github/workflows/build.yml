# Compila AstralMC Clicker para Windows y Linux desde el código de este repositorio.
# Al publicar una etiqueta vX.Y, sube los dos programas y sus SHA-256 a la Release.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 (glibc 2.35): el binario funciona en casi cualquier distro actual.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ pkg-config \
            libx11-dev libxtst-dev libxi-dev libxfixes-dev libcairo2-dev

      - name: Compilar
        run: |
          g++ -std=c++17 -O2 -s -Wall linux/astral_clicker.cpp -o AstralClicker-linux \
            $(pkg-config --cflags --libs x11 xi xfixes cairo) -pthread -static-libstdc++ -static-libgcc
          ldd AstralClicker-linux

      - name: Probar en pantalla virtual
        run: |
          apt-get install -y --no-install-recommends xvfb xdotool imagemagick fonts-dejavu-core
          Xvfb :99 -screen 0 520x460x24 &
          sleep 2
          export DISPLAY=:99
          ./AstralClicker-linux &
          APP=$!
          sleep 3
          kill -0 $APP
          import -window root screenshot-1-inicio.png
          # Clic en "Enabled", en "Break blocks" (lo apaga) y en el slot 5
          xdotool mousemove 40 120 click 1
          xdotool mousemove 40 208 click 1
          xdotool mousemove 236 294 click 1
          sleep 1
          import -window root screenshot-2-enabled.png
          # Clic en "Click on inventory": debe salir el aviso
          xdotool mousemove 40 236 click 1
          sleep 1
          import -window root screenshot-3-aviso.png
          kill -0 $APP
          kill $APP

      - name: Probar que clica (Minecraft falso)
        run: |
          # Version de prueba: simula el clic izquierdo mantenido (-DASTRAL_TEST). No se publica.
          g++ -std=c++17 -O2 -DASTRAL_TEST linux/astral_clicker.cpp -o clicker-test             $(pkg-config --cflags --libs x11 xi xfixes cairo) -pthread
          gcc -O2 .github/ci/fake_minecraft.c -o fake_minecraft -lX11 -lXtst
          Xvfb :98 -screen 0 1280x720x24 &
          sleep 2
          export DISPLAY=:98
          for MODE in break normal; do
            echo "=== Modo $MODE ==="
            if [ "$MODE" = normal ]; then ASTRAL_TEST_BREAK=0 ./clicker-test & else ./clicker-test & fi
            CLK=$!
            sleep 2
            ./fake_minecraft $MODE
            kill $CLK
            sleep 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            AstralClicker-linux
            screenshot-*.png

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compilar
        run: |
          g++ -std=c++17 -O2 -s -municode -mwindows -static -static-libgcc -static-libstdc++ \
            windows/AstralMC_Clicker.cpp -o AstralClicker.exe \
            -lcomctl32 -lwinmm -luxtheme -lgdiplus -luser32 -lgdi32
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AstralClicker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Subir a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum AstralClicker.exe AstralClicker-linux > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "AstralMC Clicker $GITHUB_REF_NAME" --notes "Compilado automáticamente desde el código de este repositorio."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            AstralClicker.exe AstralClicker-linux SHA256SUMS.txt
